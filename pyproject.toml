[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f-vra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numpy>=1.26",
    "scipy>=1.11",
    "openai>=1.40",
    "requests>=2.31",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "packaging>=24",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]
experiments = [
    "pyarrow>=17",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.scripts]
f-vra = "f_vra.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
